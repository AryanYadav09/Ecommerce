version: '3.8'

services:
  # Node.js API Gateway & Commerce Layer
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-EcommerceSecretKey2026}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-aryan32@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-aryan123}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SHOPIFY_STORE_DOMAIN=${SHOPIFY_STORE_DOMAIN}
      - SHOPIFY_STOREFRONT_ACCESS_TOKEN=${SHOPIFY_STOREFRONT_ACCESS_TOKEN}
      - SHOPIFY_ADMIN_ACCESS_TOKEN=${SHOPIFY_ADMIN_ACCESS_TOKEN}
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET}
      - SALESFORCE_INSTANCE_URL=${SALESFORCE_INSTANCE_URL}
      - SALESFORCE_CLIENT_ID=${SALESFORCE_CLIENT_ID}
      - SALESFORCE_CLIENT_SECRET=${SALESFORCE_CLIENT_SECRET}
      - SALESFORCE_USERNAME=${SALESFORCE_USERNAME}
      - SALESFORCE_PASSWORD=${SALESFORCE_PASSWORD}
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8001
      - SEARCH_SERVICE_URL=http://search-service:8002
    depends_on:
      - recommendation-service
      - search-service
    networks:
      - ecommerce-mesh

  # Python AI Recommendation Microservice
  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: ecommerce-recommendation-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - ecommerce-mesh

  # Python AI Intelligent Search Microservice
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile
    container_name: ecommerce-search-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - ecommerce-mesh

networks:
  ecommerce-mesh:
    driver: bridge
